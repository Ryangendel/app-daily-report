name: Daily App Report

# Runs in GitHub's cloud — no local machine required.
on:
  schedule:
    # 13:00 UTC = 7:00 AM Mountain Daylight / 6:00 AM Mountain Standard.
    #
    # NOTE: GitHub Actions does not run scheduled jobs on time. Under load they
    # are queued and often delayed by an hour or more, so the report actually
    # lands mid-morning Mountain time rather than exactly 7:00. A single daily
    # cron (no hour gate) guarantees exactly one email every morning. The
    # previous version fired twice and gated on the Denver hour being exactly
    # "07" — but delayed runs never hit that window, so every scheduled run
    # silently skipped and no email was sent.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credential files from secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > asc_key.p8
          printf '%s' "$GPLAY_SERVICE_ACCOUNT_JSON" > gplay-service-account.json

      - name: Send the daily report
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          ASC_PRIVATE_KEY_PATH: asc_key.p8
          GPLAY_SERVICE_ACCOUNT_FILE: gplay-service-account.json
          GPLAY_BUCKET: ${{ secrets.GPLAY_BUCKET }}
          GPLAY_PACKAGE_NAME: ${{ secrets.GPLAY_PACKAGE_NAME }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python daily_report.py

      - name: Clean up credential files
        if: always()
        run: rm -f asc_key.p8 gplay-service-account.json
