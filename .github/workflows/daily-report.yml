name: Daily App Report

# Runs in GitHub's cloud — no local machine required.
on:
  schedule:
    # GitHub Actions cron is in UTC and does not observe daylight saving, so we
    # fire at both candidate times and let the job run only when it is actually
    # 07:00 in America/Denver. 13:00 UTC = 7 AM MDT; 14:00 UTC = 7 AM MST.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Decide whether it is 7 AM Mountain
        id: gate
        run: |
          HOUR=$(TZ=America/Denver date +%H)
          echo "America/Denver hour is $HOUR"
          if [ "$HOUR" = "07" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (skipping — not 7 AM MT)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Write credential files from secrets
        if: steps.gate.outputs.run == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > asc_key.p8
          printf '%s' "$GPLAY_SERVICE_ACCOUNT_JSON" > gplay-service-account.json

      - name: Send the daily report
        if: steps.gate.outputs.run == 'true'
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          ASC_PRIVATE_KEY_PATH: asc_key.p8
          GPLAY_SERVICE_ACCOUNT_FILE: gplay-service-account.json
          GPLAY_BUCKET: ${{ secrets.GPLAY_BUCKET }}
          GPLAY_PACKAGE_NAME: ${{ secrets.GPLAY_PACKAGE_NAME }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python daily_report.py

      - name: Clean up credential files
        if: always()
        run: rm -f asc_key.p8 gplay-service-account.json
